<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sanctuaire Nintendo DS — Quentin Beaud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dark.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050a07;
      color: #f0f4f1;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      -webkit-user-select: none;
      user-select: none;
    }

    /* En-tête / Barre d'actions Dark Fantasy */
    .ds-header {
      width: 100%;
      background: linear-gradient(180deg, rgba(9, 19, 13, 0.95) 0%, rgba(5, 10, 7, 0.9) 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .ds-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ds-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .ds-status-bar {
      font-size: 0.8rem;
      color: #a8b8ad;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Badge Manette Physique */
    .ds-gp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0e1d14;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #a8b8ad;
      transition: all 0.2s ease;
    }

    .ds-gp-badge.connected {
      border-color: rgba(52, 211, 153, 0.65);
      color: #34d399;
      background: #0d2218;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    .ds-gp-icon {
      font-size: 0.88rem;
    }

    .ds-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Contrôle Volume */
    .ds-vol-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0e1d14;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 4px;
      padding: 3px 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .ds-vol-wrap:hover, .ds-vol-wrap:focus-within {
      border-color: #d4af37;
      background: #14281c;
    }

    .ds-vol-btn {
      background: none;
      border: none;
      color: #d4af37;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      line-height: 1;
      transition: transform 0.1s ease;
    }

    .ds-vol-btn:hover {
      transform: scale(1.15);
    }

    .ds-vol-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: rgba(212, 175, 55, 0.3);
      outline: none;
      cursor: pointer;
    }

    .ds-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d4af37;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
      transition: transform 0.1s ease;
    }

    .ds-vol-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .ds-vol-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d4af37;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
    }

    .ds-vol-val {
      font-size: 0.74rem;
      font-weight: 700;
      color: #d4af37;
      min-width: 28px;
    }

    .ds-lang-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0e1d14;
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 4px;
      padding: 3px 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .ds-lang-wrap:hover, .ds-lang-wrap:focus-within {
      border-color: #d4af37;
      background: #14281c;
    }

    .ds-lang-label {
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .ds-select {
      background: transparent;
      color: #d4af37;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      outline: none;
      padding: 2px 0;
    }

    .ds-select option {
      background: #09130d;
      color: #f0f4f1;
      font-weight: 600;
    }

    .ds-btn {
      color: #050a07;
      background: linear-gradient(135deg, #d4af37 0%, #997d25 100%);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: filter 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .ds-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .ds-btn-secondary {
      background: #0e1d14;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .ds-btn-secondary:hover {
      background: #14281c;
      color: #fff;
    }

    .ds-btn-active {
      color: #34d399 !important;
      border-color: rgba(52, 211, 153, 0.5) !important;
      background: #0d2218 !important;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.3) !important;
    }

    /* Zone d'affichage des écrans */
    .ds-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 6px;
      touch-action: none;
    }

    desmond-player {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }

    /* Overlay glisser-déposer */
    .ds-drop-hint {
      position: absolute;
      inset: 12px;
      border: 2px dashed rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      background: rgba(5, 10, 7, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 5;
    }

    .ds-drop-hint.active {
      opacity: 1;
      pointer-events: all;
    }

    .ds-drop-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: #d4af37;
    }

    .ds-drop-sub {
      font-size: 0.85rem;
      color: #a8b8ad;
    }
  </style>
</head>
<body>
  <div class="ds-header">
    <div class="ds-brand">
      <span style="font-size: 1.1rem;">🔮</span>
      <h1 class="ds-title">Nintendo DS Sanctuaire</h1>
      <div class="ds-gp-badge" id="ds-gp-badge" title="État de détection de la manette physique (PS5 / Xbox / Switch)">
        <span class="ds-gp-icon">🎮</span>
        <span id="ds-gp-name">Aucune manette</span>
      </div>
      <span class="ds-status-bar" id="ds-status">Prêt — Déposez une ROM (.nds)</span>
    </div>
    <div class="ds-tools">
      <div class="ds-vol-wrap" title="Volume sonore de la Nintendo DS">
        <button class="ds-vol-btn" id="ds-vol-mute" title="Couper / Rétablir le son" aria-label="Couper ou rétablir le son">🔊</button>
        <input type="range" class="ds-vol-slider" id="ds-vol-slider" min="0" max="1" step="0.02" value="0.8" aria-label="Contrôle du volume sonore">
        <span class="ds-vol-val" id="ds-vol-val">80%</span>
      </div>
      <div class="ds-lang-wrap" title="Langue de la console Nintendo DS (Micrologiciel)">
        <label for="ds-lang" class="ds-lang-label">🌐</label>
        <select id="ds-lang" class="ds-select" aria-label="Langue de la console Nintendo DS">
          <option value="2">🇫🇷 Français</option>
          <option value="1">🇬🇧 English</option>
          <option value="0">🇯🇵 日本語</option>
          <option value="3">🇩🇪 Deutsch</option>
          <option value="4">🇮🇹 Italiano</option>
          <option value="5">🇪🇸 Español</option>
        </select>
      </div>
      <button class="ds-btn ds-btn-secondary ds-btn-active" id="btn-toggle-analog" title="Activer / Désactiver le stick analogique 360° (Pour Super Mario 64 DS en Mode Tactile)">🕹️ 360° : ACTIF</button>
      <button class="ds-btn" id="btn-open-rom">📁 Insérer ROM</button>
      <button class="ds-btn ds-btn-secondary" id="btn-save-dsv" title="Télécharger le fichier de sauvegarde DSV">💾 Sauvegarder</button>
      <button class="ds-btn ds-btn-secondary" id="btn-restart" title="Redémarrer la console">🔄 Reset</button>
      <input type="file" id="file-input" accept=".nds" style="display: none;">
    </div>
  </div>

  <div class="ds-stage" id="ds-stage">
    <desmond-player id="player"></desmond-player>
    <div class="ds-drop-hint" id="drop-hint">
      <div style="font-size: 2.2rem;">📥</div>
      <div class="ds-drop-title">Déposer la relique Nintendo DS (.nds)</div>
      <div class="ds-drop-sub">Le moteur DeSmuME WebAssembly lancera immédiatement la cartouche à 60 FPS.</div>
    </div>
  </div>

  <script src="desmond.min.js?v=8.5"></script>
  <script>
    (function() {
      const player = document.querySelector("desmond-player");
      const statusEl = document.getElementById("ds-status");
      const fileInput = document.getElementById("file-input");
      const dropHint = document.getElementById("drop-hint");
      const btnOpen = document.getElementById("btn-open-rom");
      const btnSave = document.getElementById("btn-save-dsv");
      const btnReset = document.getElementById("btn-restart");
      const langSelect = document.getElementById("ds-lang");
      const btnToggleAnalog = document.getElementById("btn-toggle-analog");
      const gpBadge = document.getElementById("ds-gp-badge");
      const gpNameEl = document.getElementById("ds-gp-name");
      const volSlider = document.getElementById("ds-vol-slider");
      const volBtn = document.getElementById("ds-vol-mute");
      const volVal = document.getElementById("ds-vol-val");

      let currentLanguage = 2; // Français par défaut (0: JP, 1: EN, 2: FR, 3: DE, 4: IT, 5: ES)
      let fwLangOffset = -1;

      const dsLangNames = {
        0: "Japonais",
        1: "Anglais",
        2: "Français",
        3: "Allemand",
        4: "Italien",
        5: "Espagnol"
      };

      // Restaurer la préférence de langue depuis localStorage
      try {
        const savedLang = localStorage.getItem("nds_fw_lang");
        if (savedLang !== null) {
          const parsed = parseInt(savedLang, 10);
          if (parsed >= 0 && parsed <= 5) {
            currentLanguage = parsed;
          }
        }
      } catch (err) {}

      if (langSelect) {
        langSelect.value = String(currentLanguage);
      }

      // ====================================================================
      // GESTION DU VOLUME SONORE (DeSmuME WebAudio GainNode)
      // ====================================================================
      let currentVol = 0.8;
      let previousVol = 0.8;

      try {
        const savedVol = localStorage.getItem("rv_volume");
        if (savedVol !== null) {
          const parsed = parseFloat(savedVol);
          if (!isNaN(parsed) && parsed >= 0 && parsed <= 1) currentVol = parsed;
        }
      } catch (e) {}

      function applyVolume(val, save = true) {
        currentVol = Math.max(0, Math.min(1, Number(val)));
        if (volSlider) volSlider.value = String(currentVol);
        if (volVal) volVal.textContent = Math.round(currentVol * 100) + "%";
        if (volBtn) volBtn.textContent = currentVol === 0 ? "🔇" : "🔊";

        if (typeof window.setDsVolume === "function") {
          window.setDsVolume(currentVol);
        }
        if (save) {
          try { localStorage.setItem("rv_volume", String(currentVol)); } catch(e) {}
        }
      }

      if (volSlider) {
        volSlider.addEventListener("input", (e) => {
          applyVolume(parseFloat(e.target.value));
        });
      }

      if (volBtn) {
        volBtn.addEventListener("click", () => {
          if (currentVol > 0) {
            previousVol = currentVol;
            applyVolume(0);
          } else {
            applyVolume(previousVol > 0 ? previousVol : 0.8);
          }
        });
      }

      applyVolume(currentVol, false);

      // Déverrouillage automatique du son dans Google Chrome sur tout premier geste utilisateur
      const unlockAudio = () => {
        if (window.tryInitSound) {
          try { window.tryInitSound(); } catch(e) {}
        }
        if (window.audioContext && window.audioContext.state === "suspended") {
          window.audioContext.resume().catch(() => {});
        }
      };
      ["pointerdown", "mousedown", "touchstart", "keydown"].forEach((evt) => {
        window.addEventListener(evt, unlockAudio, { passive: true, capture: true });
      });

      // ====================================================================
      // DÉTECTION AVANCÉE DE MANETTE (PS5 DUALSENSE, XBOX, SWITCH)
      // ====================================================================
      function getGamepadBrandName(gp) {
        if (!gp || !gp.id) return "Manette active";
        const id = gp.id.toLowerCase();
        if (id.includes("dualsense") || id.includes("054c") || id.includes("ps5") || (id.includes("wireless controller") && !id.includes("xbox"))) {
          return "PS5 DualSense";
        }
        if (id.includes("dualshock") || id.includes("ps4") || id.includes("playstation")) {
          return "PlayStation";
        }
        if (id.includes("xbox") || id.includes("x-box") || id.includes("045e")) {
          return "Xbox";
        }
        if (id.includes("switch") || id.includes("pro controller") || id.includes("joy-con")) {
          return "Switch Pro";
        }
        return gp.id.length > 22 ? gp.id.substring(0, 20) + "..." : gp.id;
      }

      let lastGamepadBrand = "";

      function updateGamepadBadge(gp) {
        if (!gpBadge || !gpNameEl) return;
        if (gp && gp.connected) {
          const brand = getGamepadBrandName(gp);
          gpBadge.classList.add("connected");
          gpNameEl.textContent = brand;
          if (brand !== lastGamepadBrand) {
            lastGamepadBrand = brand;
            setStatus("🎮 " + brand + " connectée (Contrôles actifs)", "#34d399");
          }
        } else {
          gpBadge.classList.remove("connected");
          gpNameEl.textContent = "Aucune manette";
          lastGamepadBrand = "";
        }
      }

      window.onDsGamepadDetected = function(gp) {
        updateGamepadBadge(gp);
        unlockAudio();
      };

      window.onDsGamepadDisconnected = function() {
        updateGamepadBadge(null);
      };

      window.addEventListener("gamepadconnected", (e) => {
        updateGamepadBadge(e.gamepad);
        unlockAudio();
      });

      window.addEventListener("gamepaddisconnected", () => {
        updateGamepadBadge(null);
      });

      // ====================================================================
      // CONFIGURATION LANGUE FIRMWARE DS
      // ====================================================================
      function getFwLanguageOffset() {
        if (typeof Module === "undefined" || !Module.HEAPU8) return -1;
        const heap = Module.HEAPU8;
        if (fwLangOffset !== -1 && heap[fwLangOffset - 1] === 24 && heap[fwLangOffset + 1] === 3) {
          return fwLangOffset;
        }
        const needle = [68, 0, 101, 0, 83, 0, 109, 0, 117, 0, 77, 0, 69, 0]; // "DeSmuME" UTF-16
        const limit = Math.min(heap.length, 75000000);
        for (let i = 0; i < limit; i++) {
          if (heap[i] === 68 && heap[i+1] === 0 && heap[i+2] === 101 && heap[i+3] === 0) {
            let match = true;
            for (let j = 0; j < needle.length; j++) {
              if (heap[i + j] !== needle[j]) { match = false; break; }
            }
            if (match && heap[i + 80] === 3 && heap[i + 78] === 24) {
              fwLangOffset = i + 79;
              return fwLangOffset;
            }
          }
        }
        return -1;
      }

      function applyFirmwareLanguage(langCode) {
        const code = parseInt(langCode, 10);
        if (isNaN(code) || code < 0 || code > 5) return;
        currentLanguage = code;
        try { localStorage.setItem("nds_fw_lang", code); } catch(err) {}

        const offset = getFwLanguageOffset();
        if (offset !== -1 && Module.HEAPU8) {
          Module.HEAPU8[offset] = code;
        }

        try {
          if (typeof Module !== "undefined" && Module._getSymbol) {
            const ramBase = Module._getSymbol(7);
            if (ramBase && Module.HEAPU8) {
              Module.HEAPU8[ramBase + 0x3FFCE4] = 48 + code;
            }
          }
        } catch(err) {}
      }

      function ensureLanguageApplied() {
        if (typeof Module !== "undefined" && Module.HEAPU8) {
          applyFirmwareLanguage(currentLanguage);
        } else {
          setTimeout(ensureLanguageApplied, 100);
        }
      }
      ensureLanguageApplied();

      if (langSelect) {
        langSelect.addEventListener("change", (e) => {
          const newCode = parseInt(e.target.value, 10);
          applyFirmwareLanguage(newCode);
          const name = dsLangNames[newCode] || "Inconnue";
          if (typeof romSize !== "undefined" && romSize > 0) {
            setStatus("🌐 Langue : " + name + " active | Cliquez sur Reset pour recharger le jeu", "#34d399");
          } else {
            setStatus("🌐 Langue console : " + name + " active pour les prochains jeux", "#34d399");
          }
        });
      }

      // ====================================================================
      // PONT ANALOGIQUE 360° GAMEPAD -> ÉCRAN TACTILE DS
      // Conçu pour Super Mario 64 DS & contrôles analogiques continus
      // ====================================================================
      const DSAnalogBridge = (function() {
        const CENTER_X = 128;       // Centre écran tactile DS (256 / 2)
        const CENTER_Y = 96;        // Centre écran tactile DS (192 / 2)
        const MAX_RADIUS = 38;      // Rayon maximal de l'anneau tactile SM64DS
        const DEADZONE = 0.15;      // Deadzone circulaire
        const CAM_THRESHOLD = 0.45; // Seuil rotation caméra stick droit

        let enabled = true;
        let isUserPhysicalTouch = false;

        window.addEventListener("pointerdown", () => { isUserPhysicalTouch = true; }, true);
        window.addEventListener("pointerup",   () => { isUserPhysicalTouch = false; }, true);
        window.addEventListener("pointercancel", () => { isUserPhysicalTouch = false; }, true);
        window.addEventListener("mousedown",   () => { isUserPhysicalTouch = true; }, true);
        window.addEventListener("mouseup",     () => { isUserPhysicalTouch = false; }, true);
        window.addEventListener("touchstart",  () => { isUserPhysicalTouch = true; }, true);
        window.addEventListener("touchend",    () => { isUserPhysicalTouch = false; }, true);

        return {
          isEnabled() { return enabled; },
          setEnabled(val) { enabled = !!val; },
          toggle() { enabled = !enabled; return enabled; },

          process(gamepad) {
            if (!enabled || !gamepad) return false;
            if (isUserPhysicalTouch) return false;

            const ax0 = gamepad.axes[0] || 0;
            const ax1 = gamepad.axes[1] || 0;
            const mag = Math.sqrt(ax0 * ax0 + ax1 * ax1);

            let stickActive = false;

            if (mag > DEADZONE) {
              stickActive = true;
              const normalizedMag = Math.min(1.0, (mag - DEADZONE) / (1.0 - DEADZONE));
              const angle = Math.atan2(ax1, ax0);

              const targetX = CENTER_X + Math.cos(angle) * (normalizedMag * MAX_RADIUS);
              const targetY = CENTER_Y + Math.sin(angle) * (normalizedMag * MAX_RADIUS);

              window.touched = 1;
              window.touchX = Math.max(0, Math.min(255, Math.round(targetX)));
              window.touchY = Math.max(0, Math.min(191, Math.round(targetY)));
            } else {
              if (window.touched === 1) {
                window.touched = 0;
              }
            }

            // Mappage caméra stick droit (axes[2])
            if (gamepad.axes && gamepad.axes.length >= 3 && window.emuKeyState && window.keyNameToKeyId) {
              const rightX = gamepad.axes[2] || 0;
              if (rightX < -CAM_THRESHOLD) {
                window.emuKeyState[window.keyNameToKeyId.left] = true;
              } else if (rightX > CAM_THRESHOLD) {
                window.emuKeyState[window.keyNameToKeyId.right] = true;
              }
            }

            return stickActive;
          }
        };
      })();
      window.DSAnalogBridge = DSAnalogBridge;

      function updateAnalogBtnState() {
        if (!btnToggleAnalog) return;
        const active = DSAnalogBridge.isEnabled();
        btnToggleAnalog.textContent = active ? "🕹️ 360° : ACTIF" : "🕹️ 360° : OFF";
        if (active) {
          btnToggleAnalog.classList.add("ds-btn-active");
        } else {
          btnToggleAnalog.classList.remove("ds-btn-active");
        }
      }

      if (btnToggleAnalog) {
        btnToggleAnalog.addEventListener("click", () => {
          const isNowActive = DSAnalogBridge.toggle();
          updateAnalogBtnState();
          setStatus(
            isNowActive
              ? "🕹️ Stick 360° ACTIF (Requis : réglez SM64DS sur Mode Tactile dans Options)"
              : "🕹️ Stick 360° DÉSACTIVÉ (Croix D-Pad classique)",
            isNowActive ? "#34d399" : "#d4af37"
          );
        });
      }

      // ====================================================================
      // BOUCLE GAMEPAD PRINCIPALE
      // ====================================================================
      const defaultProcessGamepadInput = window.processGamepadInput;

      window.processGamepadInput = function() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let gp = null;
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i] && gamepads[i].connected) {
            gp = gamepads[i];
            break;
          }
        }

        updateGamepadBadge(gp);

        if (gp) {
          // Exécuter le mapping natif complet des touches (Cross=B, Circle=A, Square=Y, Triangle=X, L1, R1, Options=Start, Share=Select)
          if (typeof defaultProcessGamepadInput === "function") {
            defaultProcessGamepadInput();
          }

          // Traitement analogique 360° pour Mario 64 DS
          if (DSAnalogBridge.isEnabled()) {
            const stickActive = DSAnalogBridge.process(gp);

            // Si le stick analogique est actif, préserver les vrais boutons de la croix directionnelle D-Pad
            if (stickActive && window.emuKeyState && window.keyNameToKeyId) {
              const btnUp = gp.buttons[12] && gp.buttons[12].pressed;
              const btnDown = gp.buttons[13] && gp.buttons[13].pressed;
              const btnLeft = gp.buttons[14] && gp.buttons[14].pressed;
              const btnRight = gp.buttons[15] && gp.buttons[15].pressed;

              window.emuKeyState[window.keyNameToKeyId.up] = !!btnUp;
              window.emuKeyState[window.keyNameToKeyId.down] = !!btnDown;
              window.emuKeyState[window.keyNameToKeyId.left] = !!btnLeft;
              window.emuKeyState[window.keyNameToKeyId.right] = !!btnRight;
            }
          }
        } else if (typeof defaultProcessGamepadInput === "function") {
          defaultProcessGamepadInput();
        }
      };

      // Style Dark Fantasy dans le Shadow DOM du player Desmond
      if (player && player.shadowRoot) {
        const shadowStyle = document.createElement("style");
        shadowStyle.textContent = `
          #player {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            margin: 0 auto !important;
            padding: 4px !important;
          }
          canvas {
            image-rendering: pixelated !important;
            image-rendering: -moz-crisp-edges !important;
            image-rendering: crisp-edges !important;
            width: auto !important;
            max-width: 95vw !important;
            height: auto !important;
            max-height: 42vh !important;
            aspect-ratio: 4 / 3 !important;
            border: 2px solid rgba(212, 175, 55, 0.45) !important;
            border-radius: 5px !important;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.85) !important;
            background: #000 !important;
            display: block !important;
          }
          #bottom {
            cursor: crosshair !important;
            border-color: rgba(212, 175, 55, 0.7) !important;
          }
        `;
        player.shadowRoot.appendChild(shadowStyle);
      }

      function setStatus(text, color = "#d4af37") {
        if (statusEl) {
          statusEl.textContent = text;
          statusEl.style.color = color;
        }
      }

      let lastLoadedBlob = null;
      let lastLoadedName = null;

      function loadRomBlob(blob, name) {
        if (!blob) return;
        lastLoadedBlob = blob;
        lastLoadedName = name || blob.name || "relique.nds";
        applyFirmwareLanguage(currentLanguage);

        unlockAudio();

        const isSM64 = lastLoadedName.toLowerCase().includes("mario 64") || lastLoadedName.toLowerCase().includes("mario64");
        if (isSM64) {
          DSAnalogBridge.setEnabled(true);
          updateAnalogBtnState();
        }

        setStatus("⏳ Invocation de " + lastLoadedName + " (Langue : " + (dsLangNames[currentLanguage] || "FR") + ")...");
        try {
          const url = URL.createObjectURL(blob);
          if (player && typeof player.loadURL === "function") {
            player.loadURL(url, function() {
              unlockAudio();
              if (isSM64) {
                setStatus("🎮 " + lastLoadedName + " | 🕹️ Stick 360° ACTIF (Mode Tactile conseillé dans Options SM64DS)", "#34d399");
              } else {
                setStatus("🎮 En cours : " + lastLoadedName + " (Langue : " + (dsLangNames[currentLanguage] || "FR") + " — Stylet actif)", "#34d399");
              }
            });
          }
        } catch (err) {
          console.error("Erreur chargement ROM:", err);
          setStatus("❌ Erreur : " + err.message, "#ef4444");
        }
      }
      window.loadRomBlob = loadRomBlob;

      // Gestion des boutons
      btnOpen.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          loadRomBlob(file, file.name);
        }
      });

      btnSave.addEventListener("click", () => {
        if (typeof uiSaveBackup === "function") {
          uiSaveBackup();
          setStatus("💾 Fichier de sauvegarde .dsv exporté", "#34d399");
        } else {
          setStatus("⚠️ Sauvegarde non disponible pour le moment", "#fda4af");
        }
      });

      btnReset.addEventListener("click", () => {
        applyFirmwareLanguage(currentLanguage);
        if (lastLoadedBlob) {
          loadRomBlob(lastLoadedBlob, lastLoadedName);
          setStatus("🔄 Console redémarrée (Langue : " + (dsLangNames[currentLanguage] || "FR") + ")", "#34d399");
          return;
        }
        location.reload();
      });

      // Drag & Drop
      window.addEventListener("dragenter", (e) => {
        e.preventDefault();
        dropHint.classList.add("active");
      });
      window.addEventListener("dragover", (e) => {
        e.preventDefault();
      });
      window.addEventListener("dragleave", (e) => {
        if (e.relatedTarget === null || e.clientX === 0 || e.clientY === 0) {
          dropHint.classList.remove("active");
        }
      });
      window.addEventListener("drop", (e) => {
        e.preventDefault();
        dropHint.classList.remove("active");
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          loadRomBlob(file, file.name);
        }
      });

      // Mappage touches DS Desmond
      // ["right", "left", "down", "up", "select", "start", "b", "a", "y", "x", "l", "r", "debug", "lid"]
      const dsKeyMap = {
        right: 0,
        left: 1,
        down: 2,
        up: 3,
        select: 4,
        start: 5,
        b: 6,
        a: 7,
        y: 8,
        x: 9,
        l: 10,
        r: 11
      };

      const dsKeyCodeMap = {
        right: 39,
        left: 37,
        down: 40,
        up: 38,
        select: 86, // Touche V
        start: 66,  // Touche B
        b: 90,
        a: 88,
        y: 65,
        x: 83,
        l: 81,
        r: 87
      };

      // Mappage direct clavier pour le jeu DS (standalone)
      window.addEventListener("keydown", (e) => {
        unlockAudio();
        if (e.code === "KeyB") {
          if (window.emuKeyState) window.emuKeyState[5] = true; // Start
          e.preventDefault();
        } else if (e.code === "KeyV") {
          if (window.emuKeyState) window.emuKeyState[4] = true; // Select
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        if (e.code === "KeyB") {
          if (window.emuKeyState) window.emuKeyState[5] = false;
        } else if (e.code === "KeyV") {
          if (window.emuKeyState) window.emuKeyState[4] = false;
        }
      });

      // Écoute des ordres envoyés depuis la fenêtre parente (RetroVault)
      window.addEventListener("message", (e) => {
        if (!e.data) return;

        if (e.data.type === "LOAD_ROM" && e.data.blob) {
          loadRomBlob(e.data.blob, e.data.name);
        } else if (e.data.type === "SET_VOLUME") {
          const vol = parseFloat(e.data.volume);
          if (!isNaN(vol)) {
            applyVolume(vol, false);
          }
        } else if (e.data.type === "KEY_STATE") {
          const btn = (e.data.btn || "").toLowerCase();
          const isDown = !!e.data.isDown;
          const idx = dsKeyMap[btn];
          if (window.emuKeyState && idx !== undefined) {
            window.emuKeyState[idx] = isDown;
          }
          unlockAudio();
        } else if (e.data.type === "GAMEPAD_FRAME" && e.data.gamepad) {
          // Manette transférée depuis la fenêtre parente
          const gp = e.data.gamepad;
          updateGamepadBadge(gp);
          if (window.emuKeyState && window.keyNameToKeyId) {
            const ks = window.emuKeyState;
            const b = gp.buttons || {};
            if (b[0] !== undefined) ks[window.keyNameToKeyId.b] = !!b[0];
            if (b[1] !== undefined) ks[window.keyNameToKeyId.a] = !!b[1];
            if (b[2] !== undefined) ks[window.keyNameToKeyId.y] = !!b[2];
            if (b[3] !== undefined) ks[window.keyNameToKeyId.x] = !!b[3];
            if (b[4] !== undefined || b[6] !== undefined) ks[window.keyNameToKeyId.l] = !!(b[4] || b[6]);
            if (b[5] !== undefined || b[7] !== undefined) ks[window.keyNameToKeyId.r] = !!(b[5] || b[7]);
            if (b[8] !== undefined || b[17] !== undefined) ks[window.keyNameToKeyId.select] = !!(b[8] || b[17]);
            if (b[9] !== undefined || b[16] !== undefined) ks[window.keyNameToKeyId.start] = !!(b[9] || b[16]);
            if (b[12] !== undefined) ks[window.keyNameToKeyId.up] = !!b[12];
            if (b[13] !== undefined) ks[window.keyNameToKeyId.down] = !!b[13];
            if (b[14] !== undefined) ks[window.keyNameToKeyId.left] = !!b[14];
            if (b[15] !== undefined) ks[window.keyNameToKeyId.right] = !!b[15];
          }
        } else if (e.data.type === "SET_LANGUAGE") {
          const code = parseInt(e.data.lang, 10);
          if (!isNaN(code) && code >= 0 && code <= 5) {
            currentLanguage = code;
            if (langSelect) langSelect.value = String(code);
            applyFirmwareLanguage(code);
            if (lastLoadedBlob) {
              loadRomBlob(lastLoadedBlob, lastLoadedName);
            }
          }
        } else if (e.data.type === "RESET") {
          applyFirmwareLanguage(currentLanguage);
          if (lastLoadedBlob) {
            loadRomBlob(lastLoadedBlob, lastLoadedName);
            setStatus("🔄 Console réinitialisée (Langue : " + (dsLangNames[currentLanguage] || "FR") + ")", "#34d399");
            return;
          }
          location.reload();
        } else if (e.data.type === "SAVE_STATE") {
          if (typeof uiSaveBackup === "function") {
            uiSaveBackup();
            setStatus("💾 Fichier de sauvegarde .dsv exporté", "#34d399");
          }
        }
      });

      // Notifier le Sanctuaire parent que la console DS est prête
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "NDS_READY" }, "*");
        }
      } catch (err) {}
    })();
  </script>
</body>
</html>
